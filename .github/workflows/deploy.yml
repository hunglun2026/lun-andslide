name: deploy landslide-detective

# 土石流小偵探（網域確認後填）：Worker＋靜態網頁＋D1，push main 就自動部署。
# 這個 repo（hunglun2026/lun-andslide）由 ClaudeOnly 的 school/lun-andslide/ 手動同步上來，
# 原始碼真正的家在 ClaudeOnly。
#
# Settings → Secrets and variables → Actions 需要兩個：
#   CLOUDFLARE_API_TOKEN   = hunglun2026 的 Cloudflare API Token
#   CLOUDFLARE_ACCOUNT_ID  = hunglun2026 帳號的 Account ID
# Worker 的執行期密鑰（NTFY_TOPIC、ADMIN_TOKEN）另外用 Cloudflare API 設定，不經過這裡。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-landslide-detective
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安裝相依套件
        run: npm ci
      - name: 離線測試（解析與題庫）
        run: npm test
      - name: 套用資料庫 migration（已套用過的會自動略過）
        run: npx wrangler d1 migrations apply landslide-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 部署到 Cloudflare（hunglun2026）
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
